name: Apply clickable blood remains v13.29
on:
  push:
    paths:
      - '.github/workflows/apply-clickable-remains-v1329.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch clickable remains
        shell: python
        run: |
          from pathlib import Path
          import re

          combat=Path('js/combat.js')
          c=combat.read_text()
          old="  name:monster.name,\n  rotationY:"
          new="  name:monster.name,\n  slainBy:state.charDef?.name||'the hero',\n  rotationY:"
          if old not in c and 'slainBy:state.charDef?.name' not in c:
              raise SystemExit('corpse record insertion point not found')
          if old in c:
              c=c.replace(old,new,1)
          combat.write_text(c)

          game=Path('js/game.js')
          g=game.read_text()
          helper="""
function remainsText(tileKey,corpseIndex=0){
 const tile=state?.tiles?.[tileKey];
 const corpse=tile?.corpses?.[Number(corpseIndex)||0];
 if(!corpse)return '';
 const hero=corpse.slainBy||state.charDef?.name||'the hero';
 return 'The remains of a '+corpse.name+', slain by '+hero+'!';
}
function showRemains(tileKey,corpseIndex=0,event){
 if(event){event.preventDefault();event.stopPropagation();}
 const text=remainsText(tileKey,corpseIndex);
 if(!text)return;
 playSound('click');
 showModal('BATTLE REMAINS',text,[{text:'Close',fn:closeModal}]);
}
"""
          marker='function renderWorld(){'
          if 'function showRemains(' not in g:
              if marker not in g: raise SystemExit('renderWorld marker not found')
              g=g.replace(marker,helper+'\n'+marker,1)

          blood_html="""if(t.corpses&&t.corpses.length){
 d.innerHTML+=t.corpses.map((corpse,i)=>{const seed=Number(corpse.bloodSeed)||1;const left=44+(((seed>>3)%17)-8)*.7;const top=44+(((seed>>7)%17)-8)*.7;const rot=seed%360;return `<button type=\"button\" class=\"bloodRemains2d\" data-corpse-index=\"${i}\" aria-label=\"View battle remains\" title=\"Click to inspect the remains\" style=\"position:absolute;left:${left}%;top:${top}%;transform:translate(-50%,-50%) rotate(${rot}deg);width:42px;height:42px;padding:0;border:0;background:transparent;z-index:2;cursor:pointer\"><svg viewBox=\"0 0 42 42\" width=\"42\" height=\"42\" aria-hidden=\"true\"><g fill=\"#981f1f\"><circle cx=\"19\" cy=\"21\" r=\"10\"/><circle cx=\"27\" cy=\"18\" r=\"7\"/><circle cx=\"14\" cy=\"14\" r=\"5\"/><circle cx=\"34\" cy=\"29\" r=\"2.5\"/><circle cx=\"7\" cy=\"30\" r=\"2\"/><circle cx=\"31\" cy=\"8\" r=\"1.8\"/></g></svg></button>`;}).join('');
}"""
          anchor="if(t.itemPending&&!t.itemUsed)d.innerHTML+=`<span class=\"itemLocationMarker\">${iconHTML('Item Marker','Item')}</span>`;"
          if 'class=\"bloodRemains2d\"' not in g:
              if anchor not in g: raise SystemExit('2D blood insertion point not found')
              g=g.replace(anchor,anchor+blood_html,1)

          wire="""
 d.querySelectorAll('.bloodRemains2d').forEach(button=>{
  button.addEventListener('click',event=>showRemains(k,button.dataset.corpseIndex,event));
  button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showRemains(k,button.dataset.corpseIndex,event);}});
 });
"""
          wire_anchor='world.appendChild(d);wireBoardModels(d);'
          if "querySelectorAll('.bloodRemains2d')" not in g:
              if wire_anchor not in g: raise SystemExit('2D blood wiring point not found')
              g=g.replace(wire_anchor,wire_anchor+wire,1)

          action_anchor="window.BOD3DAction=function(type,tileKey){\n if(!state||boardInteractionLocked())return;"
          action_new="""window.BOD3DAction=function(type,tileKey){
 if(!state||boardInteractionLocked())return;
 if(type==='blood'){
  const parts=String(tileKey||'').split('|');
  showRemains(parts[0],Number(parts[1])||0);
  return;
 }"""
          if "if(type==='blood')" not in g:
              if action_anchor not in g: raise SystemExit('3D action insertion point not found')
              g=g.replace(action_anchor,action_new,1)
          game.write_text(g)

          scene=Path('js/scene3d.js')
          s=scene.read_text()
          s=s.replace('function addBloodStain(x,y,seed=1,offsetX=0,offsetZ=0){','function addBloodStain(x,y,seed=1,offsetX=0,offsetZ=0,tileKey=null,corpseIndex=0){',1)
          section_start=s.find('function addBloodStain(')
          section_end=s.find('\nconst CORPSE_OVERRIDES=',section_start)
          if section_start<0 or section_end<0: raise SystemExit('blood function block not found')
          section=s[section_start:section_end]
          if "markClickable(group,'blood'" not in section:
              target=' boardGroup.add(group);\n return group;'
              replacement=" if(tileKey!==null)markClickable(group,'blood',String(tileKey)+'|'+String(corpseIndex));\n boardGroup.add(group);\n return group;"
              if target not in section: raise SystemExit('blood group end not found')
              section=section.replace(target,replacement,1)
              s=s[:section_start]+section+s[section_end:]

          old_loop=""" if(t.corpses&&t.corpses.length){
  // Keep the persistent blood history, but do not draw tipped-over corpse models.
  for(const corpse of t.corpses){
   addBloodStain(
    x,
    y,
    corpse.bloodSeed||1,
    corpse.offsetX||0,
    corpse.offsetZ||0
   );
  }
 }"""
          new_loop=""" if(t.corpses&&t.corpses.length){
  // Keep the persistent blood history, and make each splat inspectable.
  t.corpses.forEach((corpse,corpseIndex)=>{
   addBloodStain(
    x,
    y,
    corpse.bloodSeed||1,
    corpse.offsetX||0,
    corpse.offsetZ||0,
    key,
    corpseIndex
   );
  });
 }"""
          if old_loop in s:
              s=s.replace(old_loop,new_loop,1)
          elif "corpseIndex\n   );" not in s:
              raise SystemExit('corpse blood loop not found')
          scene.write_text(s)

          index=Path('index.html')
          h=index.read_text()
          h=re.sub(r'data-build-version=\"v[0-9.]+\"','data-build-version=\"v13.29\"',h,count=1)
          h=re.sub(r'js/game\.js\?cache=[^\"\']+','js/game.js?cache=20260808-clickable-remains-v1329',h,count=1)
          h=re.sub(r'js/combat\.js\?cache=[^\"\']+','js/combat.js?cache=20260808-clickable-remains-v1329',h,count=1)
          h=re.sub(r'js/scene3d\.js\?cache=[^\"\']+','js/scene3d.js?cache=20260808-clickable-remains-v1329',h,count=1)
          index.write_text(h)
      - name: Commit TEST v13.29
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/game.js js/combat.js js/scene3d.js index.html
          git commit -m "Add clickable 2D and 3D battle remains v13.29"
          git push
