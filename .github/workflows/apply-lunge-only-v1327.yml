name: Apply lunge-only combat v13.27
on:
  push:
    paths:
      - '.github/workflows/apply-lunge-only-v1327.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/remove_combat_swing_rotation_v1327.py
      - run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/scene3d.js index.html
          git commit -m "Remove combat swing rotation; keep lunge only v13.27"
          git push
