name: BOD3D TEST v13.64 reliable backdrop close

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve information popup backdrop closing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          old="modal.addEventListener('click',event=>{if(event.target===modal&&modal.dataset.backdropClose==='1')closeModal();});"
          new="modal.addEventListener('click',event=>{const insideCard=event.target.closest&&event.target.closest('.card');if(!insideCard&&modal.dataset.backdropClose==='1')closeModal();});"
          s=once(s,old,new,'backdrop click handler')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.63"','data-build-version="v13.64"','build version')
          s=once(s,'js/game.js?cache=20260813-v1363','js/game.js?cache=20260813-v1364','game cache')
          s=once(s,'js/ui.js?v=13.63','js/ui.js?v=13.64','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// TEST v13.63 — add The Short Story to hamburger menu; TEST-only version marker.','// TEST v13.64 — reliably close information popups by tapping outside the card; TEST-only version marker.','ui comment')
          s=once(s,"const version='v13.63';","const version='v13.64';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          assert "event.target.closest&&event.target.closest('.card')" in game
          assert "event.target===modal&&modal.dataset.backdropClose==='1'" not in game
          assert "modal.dataset.backdropClose=buttons.some(x=>String(x.text||'').trim()==='Close')?'1':'0'" in game
          assert "{text:'The Short Story',fn:()=>{closeModal();openShortStory();}}," in game
          assert 'data-build-version="v13.64"' in idx
          assert 'js/game.js?cache=20260813-v1364' in idx
          assert 'js/ui.js?v=13.64' in idx
          assert "const version='v13.64';" in ui
          print('v13.64 validated: outside-card click closes only Close-button information modals')
          PY

      - name: Commit validated TEST v13.64
        shell: bash
        run: |
          rm -f .github/workflows/backdrop-close-v1364.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/backdrop-close-v1364.yml
          git diff --cached --check
          git commit -m "v13.64: make popup backdrop tap close reliable"
          git push
