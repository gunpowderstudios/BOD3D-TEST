name: BOD3D TEST v13.65 menu click fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix backdrop handler ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          old="modal.addEventListener('click',event=>{const insideCard=event.target.closest&&event.target.closest('.card');if(!insideCard&&modal.dataset.backdropClose==='1')closeModal();});"
          new="modal.addEventListener('click',event=>{const insideCard=event.target.closest&&event.target.closest('.card');if(!insideCard&&modal.dataset.backdropClose==='1')closeModal();},true);"
          s=once(s,old,new,'capture-phase backdrop handler')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.64"','data-build-version="v13.65"','build version')
          s=once(s,'js/game.js?cache=20260813-v1364','js/game.js?cache=20260813-v1365','game cache')
          s=once(s,'js/ui.js?v=13.64','js/ui.js?v=13.65','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// TEST v13.64 — reliably close information popups by tapping outside the card; TEST-only version marker.','// TEST v13.65 — fix menu item clicks while retaining outside-tap closing; TEST-only version marker.','ui comment')
          s=once(s,"const version='v13.64';","const version='v13.65';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          assert "modal.addEventListener('click',event=>{const insideCard=event.target.closest&&event.target.closest('.card');if(!insideCard&&modal.dataset.backdropClose==='1')closeModal();},true);" in game
          assert "{text:'Rules',fn:()=>{closeModal();openRules();}}" in game
          assert "{text:'The Short Story',fn:()=>{closeModal();openShortStory();}}" in game
          assert "{text:'About',fn:()=>{closeModal();openAbout();}}" in game
          assert 'data-build-version="v13.65"' in idx
          assert 'js/game.js?cache=20260813-v1365' in idx
          assert 'js/ui.js?v=13.65' in idx
          assert "const version='v13.65';" in ui
          print('v13.65 validated: menu clicks preserved; backdrop close runs in capture phase')
          PY

      - name: Commit validated TEST v13.65
        shell: bash
        run: |
          rm -f .github/workflows/backdrop-close-v1365.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/backdrop-close-v1365.yml
          git diff --cached --check
          git commit -m "v13.65: fix menu clicks with backdrop close"
          git push
