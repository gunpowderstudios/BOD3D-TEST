name: BOD3D TEST v13.66 physical backdrop close

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use physical card bounds for backdrop close
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          old="function showModal(title,body,buttons){const modal=document.getElementById('modal');modal.classList.remove('modalEdge','questLogModal','rewardChoiceModal','introScrollModal','endingScrollModal','aboutModal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent=body;const mb=document.getElementById('modalButtons');mb.innerHTML='';buttons.forEach(x=>addBtn(mb,x.text,x.cls,x.fn));const edgeInfo=buttons.length===1&&/^(Close|Continue)$/.test(buttons[0].text||'')&&String(body||'').length<360;modal.classList.toggle('modalEdge',edgeInfo);modal.dataset.backdropClose=buttons.some(x=>String(x.text||'').trim()==='Close')?'1':'0';if(!modal.dataset.backdropCloseWired){modal.dataset.backdropCloseWired='1';modal.addEventListener('click',event=>{const insideCard=event.target.closest&&event.target.closest('.card');if(!insideCard&&modal.dataset.backdropClose==='1')closeModal();},true);}modal.classList.add('open');}"
          new="function showModal(title,body,buttons){const modal=document.getElementById('modal');modal.classList.remove('modalEdge','questLogModal','rewardChoiceModal','introScrollModal','endingScrollModal','aboutModal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent=body;const mb=document.getElementById('modalButtons');mb.innerHTML='';buttons.forEach(x=>addBtn(mb,x.text,x.cls,x.fn));const edgeInfo=buttons.length===1&&/^(Close|Continue)$/.test(buttons[0].text||'')&&String(body||'').length<360;modal.classList.toggle('modalEdge',edgeInfo);const simpleBackdropClose=buttons.some(x=>String(x.text||'').trim()==='Close')||String(title||'').trim()==='Menu';modal.dataset.backdropClose=simpleBackdropClose?'1':'0';if(!modal.dataset.backdropCloseWired){modal.dataset.backdropCloseWired='1';modal.addEventListener('click',event=>{if(modal.dataset.backdropClose!=='1')return;const card=modal.querySelector('.card');if(!card)return;const r=card.getBoundingClientRect();const outside=event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom;if(outside)closeModal();},true);}modal.classList.add('open');}"
          s=once(s,old,new,'showModal backdrop logic')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.65"','data-build-version="v13.66"','build version')
          s=once(s,'js/game.js?cache=20260813-v1365','js/game.js?cache=20260813-v1366','game cache')
          s=once(s,'js/ui.js?v=13.65','js/ui.js?v=13.66','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// TEST v13.65 — fix menu item clicks while retaining outside-tap closing; TEST-only version marker.','// TEST v13.66 — close simple popups using physical card bounds; TEST-only version marker.','ui comment')
          s=once(s,"const version='v13.65';","const version='v13.66';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          assert "getBoundingClientRect()" in game
          assert "String(title||'').trim()==='Menu'" in game
          assert "event.clientX<r.left" in game and "event.clientY>r.bottom" in game
          assert "event.target.closest" not in game[game.index('function showModal'):game.index('function closeModal')]
          assert 'data-build-version="v13.66"' in idx
          assert 'js/game.js?cache=20260813-v1366' in idx
          assert 'js/ui.js?v=13.66' in idx
          assert "const version='v13.66';" in ui
          print('v13.66 validated: backdrop closing uses visible card bounds; menu remains selectable')
          PY

      - name: Commit validated TEST v13.66
        shell: bash
        run: |
          rm -f .github/workflows/backdrop-close-v1366.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/backdrop-close-v1366.yml
          git diff --cached --check
          git commit -m "v13.66: close popups by tapping outside visible card"
          git push
