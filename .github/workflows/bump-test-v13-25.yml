name: Apply TEST v13.26 tile drop
on:
  push:
    paths:
      - '.github/workflows/bump-test-v13-25.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tile drop patch
        run: python tools/tile_drop_patch_v1326.py
      - name: Commit
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/scene3d.js js/game.js index.html
          git commit -m "Drop newly placed tiles from 10mm with fade and impact sound v13.26"
          git push
