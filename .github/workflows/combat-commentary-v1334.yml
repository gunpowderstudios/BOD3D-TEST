name: Desktop combat commentary v13.34
on:
  push:
    paths:
      - '.github/workflows/combat-commentary-v1334.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/combat_commentary_v1334.py
      - name: Commit TEST v13.34
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/combat.js css/dark-combat.css index.html
          git commit -m "Add desktop combat latest-action commentary v13.34"
