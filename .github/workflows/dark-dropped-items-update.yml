name: BOD3D TEST dark dropped items

on:
  push:
    paths:
      - '.github/workflows/dark-dropped-items-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Darken dropped-item popup cards
        run: |
          echo '' | base64 -d > /tmp/update.py
          python3 /tmp/update.py
      - name: Commit TEST popup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/patches.css
          git commit -m "Fix dropped item popup colours in TEST"
          git push origin main
