name: Keep ending scroll reopenable v13.25
on:
  push:
    paths:
      - '.github/workflows/ending-return-v13-25.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ending and quest log navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/game.js')
          s=p.read_text()
          old="""function win(){
 state.gameOver=true;
 sndWin();
 closeCombat();
 window.startEndGameMusic?.();
 const rescuedFirkin=!!state.player.companionFirkin;
 showModal('YOU ESCAPED!','',[{text:'New Game',cls:'green',fn:()=>{window.stopEndGameMusic?.();showCharSelect();}}]);
 document.getElementById('modal')?.classList.add('endingScrollModal');
 const body=document.getElementById('modalBody');
 if(body)body.innerHTML=endingScrollHTML(rescuedFirkin);
}
"""
          new="""function showWinEnding(){
 const rescuedFirkin=!!state.player.companionFirkin;
 showModal('YOU ESCAPED!','',[{text:'New Game',cls:'green',fn:()=>{window.stopEndGameMusic?.();showCharSelect();}}]);
 document.getElementById('modal')?.classList.add('endingScrollModal');
 const body=document.getElementById('modalBody');
 if(body){body.innerHTML=endingScrollHTML(rescuedFirkin);body.scrollTop=0;}
}
function win(){
 state.gameOver=true;
 state.won=true;
 sndWin();
 closeCombat();
 window.startEndGameMusic?.();
 showWinEnding();
}
"""
          if old not in s:
              raise SystemExit('win block not found')
          s=s.replace(old,new,1)
          old2="""function showQuestLogViewer(fromGameOver=false){
 const buttons=fromGameOver
  ?[{text:'Back to Game Over',fn:showGameOverModal},{text:'New Game',cls:'green',fn:()=>{showCharSelect();}}]
  :[{text:'Close',fn:closeModal}];
"""
          new2="""function showQuestLogViewer(fromGameOver=false){
 const buttons=state?.won
  ?[{text:'Back to Ending',fn:showWinEnding},{text:'New Game',cls:'green',fn:()=>{window.stopEndGameMusic?.();showCharSelect();}}]
  :(fromGameOver
   ?[{text:'Back to Game Over',fn:showGameOverModal},{text:'New Game',cls:'green',fn:()=>{showCharSelect();}}]
   :[{text:'Close',fn:closeModal}]);
"""
          if old2 not in s:
              raise SystemExit('quest log block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          import re
          h=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.25"',h,count=1)
          h=re.sub(r'js/game\.js\?cache=[^"\']+','js/game.js?cache=20260807-ending-return-v1325',h,count=1)
          i.write_text(h)
      - name: Commit
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/game.js index.html
          git commit -m "Keep winning ending scroll reopenable from Quest Log v13.25"
          git push
