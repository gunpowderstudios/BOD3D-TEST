name: Fix combat pulse TEST v13.16
on:
  push:
    paths:
      - '.github/workflows/fix-combat-pulse-v13-16.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve combat miniatures during attack pulse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          combat=Path('js/combat.js')
          s=combat.read_text()
          old="if(mt>pt)playSound('heroHurt');\n render();renderCombat();"
          new="if(mt>pt)playSound('heroHurt');\n // Keep the staged 3D hero/monster objects alive for the full 0.5-second attack pulse.\n // A full board render here replaces the monster pivot and cancels both animations.\n renderCombat();"
          if old not in s:
              raise SystemExit('combat target not found')
          s=s.replace(old,new,1)
          combat.write_text(s)

          index=Path('index.html')
          h=index.read_text()
          h=h.replace('data-build-version="v13.15"','data-build-version="v13.16"',1)
          h=h.replace('js/game.js?cache=20260807-outcome-swings-v1313','js/game.js?cache=20260807-combat-pulse-v1316',1)
          h=h.replace('js/combat.js?cache=20260807-outcome-swings-v1313','js/combat.js?cache=20260807-combat-pulse-v1316',1)
          h=h.replace('js/scene3d.js?cache=20260807-outcome-swings-v1313','js/scene3d.js?cache=20260807-combat-pulse-v1316',1)
          index.write_text(h)
          PY
      - name: Commit TEST v13.16
        run: |
          git config user.name 'Gunpowder Studios Deploy'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add index.html js/combat.js
          git commit -m 'Keep combat miniatures alive during attack pulse v13.16'
          git push
