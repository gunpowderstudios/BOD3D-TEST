name: BOD3D TEST v13.53 intro parchment scroll fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix parchment scrolling without changing gameplay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p='css/main.css'; s=read(p)
          pat=re.compile(r'/\* ===== Opening warning scroll — canonical v13\.52 ===== \*/.*?(?=/\* v13\.51 — canonical character-selector label polish\. \*/)',re.S)
          if len(pat.findall(s))!=1:
              raise SystemExit('main.css: v13.52 parchment block not uniquely found')
          block=r'''/* ===== Opening warning scroll — canonical v13.53 ===== */
          #modal.introScrollModal{
            padding:clamp(8px,2vw,20px)!important;
            overflow:hidden!important;
          }
          #modal.introScrollModal .card{
            box-sizing:border-box!important;
            width:min(900px,calc(100vw - 40px),calc((100dvh - 36px) * 1.58))!important;
            max-width:none!important;
            height:auto!important;
            max-height:calc(100dvh - 36px)!important;
            aspect-ratio:1.58 / 1!important;
            margin:auto!important;
            padding:20px 7.5% 6.5% 7.5%!important;
            border:0!important;
            background:transparent url('../assets/ui/scroll.png') center / 100% 100% no-repeat!important;
            box-shadow:none!important;
            display:grid!important;
            grid-template-rows:minmax(0,1fr) auto!important;
            gap:clamp(8px,1.2vh,14px)!important;
            overflow:hidden!important;
          }
          #modal.introScrollModal .card>h2{display:none!important}
          #modal.introScrollModal .testerWarningScroll{
            box-sizing:border-box!important;
            width:100%!important;
            max-width:100%!important;
            min-width:0!important;
            height:100%!important;
            min-height:0!important;
            margin:0!important;
            padding:0!important;
            background:none!important;
            color:#000!important;
            border:0!important;
            box-shadow:none!important;
            overflow-y:auto!important;
            overflow-x:hidden!important;
            -webkit-overflow-scrolling:touch!important;
            overscroll-behavior:contain!important;
            scrollbar-width:none!important;
            font-family:"Alegreya",Georgia,serif!important;
            font-size:clamp(16px,1.55vw,21px)!important;
            font-weight:400!important;
            line-height:1.27!important;
            text-align:center!important;
          }
          #modal.introScrollModal .testerWarningScroll::-webkit-scrollbar{display:none!important}
          #modal.introScrollModal .testerWarningScroll>div:first-child{
            font-size:clamp(27px,3vw,42px)!important;
            font-weight:700!important;
            line-height:1.02!important;
            margin:0 0 .55em!important;
          }
          #modal.introScrollModal .testerWarningScroll b,
          #modal.introScrollModal .testerWarningScroll strong{font-weight:700!important}
          #modal.introScrollModal #modalButtons{
            position:static!important;
            inset:auto!important;
            transform:none!important;
            width:100%!important;
            min-width:0!important;
            margin:0!important;
            padding:0 8%!important;
            display:flex!important;
            justify-content:center!important;
            align-items:center!important;
            z-index:5!important;
            pointer-events:auto!important;
          }
          #modal.introScrollModal #modalButtons button{
            width:min(420px,100%)!important;
            min-width:0!important;
            min-height:48px!important;
            margin:0!important;
            padding:10px 18px!important;
            font-size:clamp(15px,1.35vw,19px)!important;
            line-height:1.1!important;
          }
          @media(max-height:760px) and (min-width:901px){
            #modal.introScrollModal{padding:5px 12px!important}
            #modal.introScrollModal .card{
              width:min(820px,calc(100vw - 28px),calc((100dvh - 12px) * 1.58))!important;
              max-height:calc(100dvh - 12px)!important;
              padding:20px 7.5% 5.8% 7.5%!important;
              gap:5px!important;
            }
            #modal.introScrollModal .testerWarningScroll{font-size:clamp(14px,1.3vw,18px)!important;line-height:1.18!important}
            #modal.introScrollModal .testerWarningScroll>div:first-child{font-size:clamp(24px,2.5vw,34px)!important;margin-bottom:.35em!important}
            #modal.introScrollModal #modalButtons button{min-height:40px!important;padding:7px 14px!important;font-size:14px!important}
          }

          '''
          s=pat.sub(block,s,count=1)
          write(p,s)

          p='css/mobile.css'; s=read(p)
          pat=re.compile(r'/\* ===== Opening warning scroll — canonical mobile layout v13\.51 ===== \*/.*?(?=/\* v13\.51 — UI styles moved out of js/ui\.js\. \*/)',re.S)
          if len(pat.findall(s))!=1:
              raise SystemExit('mobile.css: v13.51 opening parchment block not uniquely found')
          mobile=r'''/* ===== Opening warning scroll — canonical mobile layout v13.53 ===== */
          @media(max-width:900px){
            #modal.introScrollModal{padding:8px!important;align-items:center!important}
            #modal.introScrollModal .card{
              width:calc(100vw - 16px)!important;
              height:min(76dvh,680px)!important;
              max-height:calc(100dvh - 16px)!important;
              aspect-ratio:auto!important;
              padding:8.5% 12.5% 6.5% 14.5%!important;
              gap:7px!important;
            }
            #modal.introScrollModal .testerWarningScroll{
              font-size:clamp(15px,3.8vw,18px)!important;
              line-height:1.24!important;
              padding:0 1%!important;
            }
            #modal.introScrollModal .testerWarningScroll>div:first-child{
              font-size:clamp(24px,6.3vw,32px)!important;
              margin-bottom:.48em!important;
            }
            #modal.introScrollModal #modalButtons{padding:0 4%!important}
            #modal.introScrollModal #modalButtons button{
              width:min(360px,100%)!important;
              min-height:50px!important;
              padding:11px 14px!important;
              font-size:clamp(16px,4vw,18px)!important;
            }
            .heroStat small,.heroSpecialBlock small{font-size:12px!important}
          }
          @media(max-width:420px) and (max-height:720px){
            #modal.introScrollModal .card{height:calc(100dvh - 12px)!important;padding:8% 12% 5.8% 14%!important;gap:4px!important}
            #modal.introScrollModal .testerWarningScroll{font-size:clamp(13px,3.45vw,15px)!important;line-height:1.18!important}
            #modal.introScrollModal .testerWarningScroll>div:first-child{font-size:clamp(21px,5.6vw,26px)!important;margin-bottom:.28em!important}
            #modal.introScrollModal #modalButtons button{min-height:44px!important;padding:8px 12px!important;font-size:15px!important}
          }

          '''
          s=pat.sub(mobile,s,count=1)
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,"const version='v13.52';","const version='v13.53';",'ui version')
          s=once(s,'// TEST v13.52 — parchment restored to proven main.css structure; UI behaviour remains here.','// TEST v13.53 — parchment fixed-size again; intro text scrolls internally while the button stays anchored.','ui comment')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.52"','data-build-version="v13.53"','index build')
          s=once(s,'css/main.css?v=13.52','css/main.css?v=13.53','main cache')
          s=once(s,'css/mobile.css?v=13.51','css/mobile.css?v=13.53','mobile cache')
          s=once(s,'js/ui.js?v=13.52','js/ui.js?v=13.53','ui cache')
          write(p,s)

          main=read('css/main.css'); mobile=read('css/mobile.css'); idx=read('index.html')
          assert 'canonical v13.53' in main and 'canonical v13.52' not in main
          assert '#modal.introScrollModal .card{' in main
          assert "background:transparent url('../assets/ui/scroll.png') center / 100% 100% no-repeat!important;" in main
          assert 'padding:20px 7.5% 6.5% 7.5%!important;' in main
          assert 'overflow-y:auto!important;' in main
          assert 'canonical mobile layout v13.53' in mobile
          assert '#modal.introScrollModal .card' in mobile
          assert 'data-build-version="v13.53"' in idx
          assert 'css/main.css?v=13.53' in idx and 'css/mobile.css?v=13.53' in idx and 'js/ui.js?v=13.53' in idx
          print('v13.53 intro parchment scrolling validated')
          PY

      - name: Commit validated fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-intro-scroll-v1353.yml
          git config user.name "BOD3D TEST fixer"
          git config user.email "actions@users.noreply.github.com"
          git add index.html css/main.css css/mobile.css js/ui.js .github/workflows/fix-intro-scroll-v1353.yml
          git diff --cached --check
          git commit -m "v13.53: restore fixed parchment with internal scrolling"
          git push
