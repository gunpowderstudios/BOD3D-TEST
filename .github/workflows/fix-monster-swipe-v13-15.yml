name: Fix monster swipe TEST v13.15
on:
  push:
    paths:
      - '.github/workflows/fix-monster-swipe-v13-15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror monster swipe and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/scene3d.js')
          s=p.read_text()
          old="""   hero.rotation.y=yawTowards(hero.position,monster.position)+(heroSwiping?swipeAngle:0);\n   monster.rotation.y=yawTowards(monster.position,hero.position)+(monsterSwiping?swipeAngle:0);"""
          new="""   hero.rotation.y=yawTowards(hero.position,monster.position)+(heroSwiping?swipeAngle:0);\n   // Monster faces the hero from the opposite direction, so mirror the swipe\n   // angle to make its 45-degree attack read as the same visible strike.\n   monster.rotation.y=yawTowards(monster.position,hero.position)-(monsterSwiping?swipeAngle:0);"""
          if old not in s:
              raise SystemExit('monster swipe target not found')
          p.write_text(s.replace(old,new,1))

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.14"','data-build-version="v13.15"',1)
          i.write_text(h)
          PY
          git config user.name 'Gunpowder Studios Deploy'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add js/scene3d.js index.html
          git commit -m 'Mirror monster combat swipe and publish TEST v13.15'
          git push
