name: Load Magic Sword target v13.24
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data-build-version="v13.22"','data-build-version="v13.24"',1)
          needle='<script src="js/game.js?cache=20260807-health-hud-v1322"></script>'
          replacement=needle+'\n<script src="js/magic-sword-target.js?cache=20260807-v1324"></script>'
          if needle not in s:
              raise SystemExit('game script tag not found')
          p.write_text(s.replace(needle,replacement,1))
          PY
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add index.html
          git commit -m "Load Magic Sword click-target patch v13.24"
          git push
