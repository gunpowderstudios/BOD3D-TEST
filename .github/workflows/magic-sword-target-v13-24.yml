name: Magic Sword click target v13.24
on:
  push:
    paths:
      - '.github/workflows/magic-sword-target-v13-24.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace directional Magic Sword peek with click targeting
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/game.js')
          s=p.read_text()

          s=s.replace("{name:'Magic Sword',copies:1,type:'equipment',slot:'weapon',icon:'🗡',desc:'+2 combat roll. View adjacent monster.'}","{name:'Magic Sword',copies:1,type:'equipment',slot:'weapon',icon:'🗡',desc:'+2 combat roll. Use it to reveal and view an adjacent hidden monster.'}",1)

          old=""" if([p.slots.left,p.slots.right].some(item=>item?.name==='Magic Sword'))html+=magicSwordPeekHTML();
 el.innerHTML=html;
}
function magicSwordPeekHTML(){const p=state.player;let rows=[];for(const dir of dirOrder){const d=DIRS[dir],t=getTile(p.x+d.dx,p.y+d.dy);if(t&&(t.monsterPending||(t.monster&&!t.monster.revealed)))rows.push(`<button class=\"peekBtn\" onclick=\"peekMonster('${dir}')\">View ${dir}</button>`);}return rows.length?'<div class=\"sectionTitle\">Magic Sword</div><div class=\"small\">View adjacent monster:</div>'+rows.join(' '):'';}
window.peekMonster=function(dir){const p=state.player,d=DIRS[dir],t=getTile(p.x+d.dx,p.y+d.dy);if(!t)return;if(t.monsterPending&&!t.monster){t.monster=drawMonster();t.monsterPending=false;}if(t.monster){t.monster.peeked=true;showModal('Magic Sword: '+dir,t.monster.name+'\\nHealth '+t.monster.maxHealth+'\\nCombat '+t.monster.dice+'d6+'+t.monster.mod,[{text:'Close',fn:closeModal}]);render();}};
"""
          new=""" el.innerHTML=html;
}
let magicSwordTargetMode=false;
function magicSwordEquipped(){return [state?.player?.slots?.left,state?.player?.slots?.right].some(item=>item?.name==='Magic Sword');}
function magicSwordAdjacentTargetKeys(){
 if(!state?.player)return [];
 const p=state.player,out=[];
 for(const dir of dirOrder){
  const d=DIRS[dir],kk=key(p.x+d.dx,p.y+d.dy),t=state.tiles[kk];
  if(t&&(t.monsterPending||(t.monster&&t.monster.health>0&&!t.monster.revealed&&!t.monster.peeked)))out.push(kk);
 }
 return out;
}
function startMagicSwordTarget(){
 if(!magicSwordEquipped()){toast('Equip the Magic Sword first');return;}
 const targets=magicSwordAdjacentTargetKeys();
 if(!targets.length){toast('No hidden monster is adjacent');return;}
 magicSwordTargetMode=true;
 closeModal();
 toast('Magic Sword: click an adjacent hidden monster');
 render();
}
function cancelMagicSwordTarget(){magicSwordTargetMode=false;toast('Magic Sword cancelled');render();}
function useMagicSwordOnTile(tileKey){
 if(!magicSwordTargetMode)return false;
 if(!magicSwordEquipped()){magicSwordTargetMode=false;render();return false;}
 if(!magicSwordAdjacentTargetKeys().includes(tileKey)){toast('Choose an adjacent hidden monster');return false;}
 const t=state.tiles[tileKey];
 if(!t)return false;
 if(t.monsterPending&&!t.monster){t.monster=drawMonster();t.monsterPending=false;}
 const m=t.monster;
 if(!m)return false;
 magicSwordTargetMode=false;
 m.peeked=true;
 const sword=[state.player.slots.left,state.player.slots.right].find(item=>item?.name==='Magic Sword');
 if(sword)playItemSound(sword);
 render();
 showModal('Magic Sword',m.name+'\\nHealth '+m.maxHealth+'\\nCombat '+m.dice+'d6+'+m.mod,[{text:'Close',fn:closeModal}]);
 return true;
}
window.startMagicSwordTarget=startMagicSwordTarget;
"""
          if old not in s: raise SystemExit('old Magic Sword directional block not found')
          s=s.replace(old,new,1)

          old="""function inspectItemObject(item){playItemSound(item);const buttons=[];const eq=equippedSlotFor(item);if(item.type==='equipment'||isHandItem(item)||isAttire(item)){"""
          new="""function inspectItemObject(item){playItemSound(item);const buttons=[];const eq=equippedSlotFor(item);if(item.name==='Magic Sword'&&magicSwordEquipped())buttons.push({text:'Use Magic Sword',cls:'green',fn:startMagicSwordTarget});if(item.type==='equipment'||isHandItem(item)||isAttire(item)){"""
          if old not in s: raise SystemExit('inspectItemObject insertion point not found')
          s=s.replace(old,new,1)

          old="""}if((t.monsterPending)||(t.monster&&t.monster.health>0)){d.innerHTML+=(t.monster&&(t.monster.revealed||t.monster.peeked))?monsterBoardHTML(t.monster,rangedMode&&rangedMode.targetKeys.has(k)?' rangedTarget':'',k):`<span class=\"hiddenMonster${rangedMode&&rangedMode.targetKeys.has(k)?' rangedTarget':''}\" role=\"button\" tabindex=\"0\" data-ranged-key=\"${k}\">${iconHTML('Hidden Monster','M')}</span>`;}world.appendChild(d);wireBoardModels(d);"""
          new="""}if((t.monsterPending)||(t.monster&&t.monster.health>0)){const magicTarget=magicSwordTargetMode&&magicSwordAdjacentTargetKeys().includes(k);d.innerHTML+=(t.monster&&(t.monster.revealed||t.monster.peeked))?monsterBoardHTML(t.monster,rangedMode&&rangedMode.targetKeys.has(k)?' rangedTarget':'',k):`<span class=\"hiddenMonster${rangedMode&&rangedMode.targetKeys.has(k)?' rangedTarget':''}${magicTarget?' rangedTarget':''}\" role=\"button\" tabindex=\"0\" data-ranged-key=\"${k}\">${iconHTML('Hidden Monster','M')}</span>`;}world.appendChild(d);wireBoardModels(d);"""
          if old not in s: raise SystemExit('hidden monster render block not found')
          s=s.replace(old,new,1)

          old=""" const hiddenButton=d.querySelector('.hiddenMonster.rangedTarget');
 if(hiddenButton){hiddenButton.addEventListener('click',e=>fireRangedAt(hiddenButton.dataset.rangedKey,e));hiddenButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fireRangedAt(hiddenButton.dataset.rangedKey,e);}});}
"""
          new=""" const hiddenButton=d.querySelector('.hiddenMonster.rangedTarget');
 if(hiddenButton){hiddenButton.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(magicSwordTargetMode)useMagicSwordOnTile(hiddenButton.dataset.rangedKey);else fireRangedAt(hiddenButton.dataset.rangedKey,e);});hiddenButton.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(magicSwordTargetMode)useMagicSwordOnTile(hiddenButton.dataset.rangedKey);else fireRangedAt(hiddenButton.dataset.rangedKey,e);}});}
"""
          if old not in s: raise SystemExit('hidden monster click block not found')
          s=s.replace(old,new,1)

          old=""" if(type==='hidden'&&rangedMode){fireRangedAt(tileKey);return;}
"""
          new=""" if(type==='hidden'&&magicSwordTargetMode){useMagicSwordOnTile(tileKey);return;}
 if(type==='hidden'&&rangedMode){fireRangedAt(tileKey);return;}
"""
          if old not in s: raise SystemExit('BOD3D hidden action insertion point not found')
          s=s.replace(old,new,1)

          old=""" const blocked=!view3d.enabled||state.gameOver||!!combat||!!placement||!!teleportItem||!!rangedMode;
"""
          new=""" const blocked=!view3d.enabled||state.gameOver||!!combat||!!placement||!!teleportItem||!!rangedMode||magicSwordTargetMode;
"""
          if old not in s: raise SystemExit('mobile dpad blocked line not found')
          s=s.replace(old,new,1)

          old=""" if(teleportItem){addBtn(wrap,'Cancel Teleport','red',cancelTeleport);return;}
 if(rangedMode){addBtn(wrap,'Cancel Ranged Attack','red',cancelRangedAttack);return;}
"""
          new=""" if(teleportItem){addBtn(wrap,'Cancel Teleport','red',cancelTeleport);return;}
 if(rangedMode){addBtn(wrap,'Cancel Ranged Attack','red',cancelRangedAttack);return;}
 if(magicSwordTargetMode){addBtn(wrap,'Cancel Magic Sword','red',cancelMagicSwordTarget);return;}
"""
          if old not in s: raise SystemExit('renderControls target-mode insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.22"','data-build-version="v13.24"',1)
          h=h.replace('js/game.js?cache=20260807-health-hud-v1322','js/game.js?cache=20260807-magic-sword-v1324',1)
          i.write_text(h)
      - name: Commit
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/game.js index.html
          git commit -m "Add click-target Magic Sword reveal v13.24"
          git push
