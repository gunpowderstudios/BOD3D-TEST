name: BOD3D TEST v13.59 mobile combat quest

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide quest objective during mobile combat only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          # main.css — add one mobile-combat-only visibility rule.
          p='css/main.css'; s=read(p)
          old='''@media(max-width:800px){
  #questObjective{
    top:51px;
    width:calc(100% - 130px);
    font-size:12px;
    line-height:1.15;
  }
}
'''
          new='''@media(max-width:800px){
  #questObjective{
    top:51px;
    width:calc(100% - 130px);
    font-size:12px;
    line-height:1.15;
  }
  body.combatActive #questObjective{display:none!important;}
}
'''
          s=once(s,old,new,'mobile quest media block')
          write(p,s)

          # index.html — version/cache markers only.
          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.58"','data-build-version="v13.59"','build version')
          s=once(s,'css/main.css?v=13.55','css/main.css?v=13.59','main css cache')
          s=once(s,'js/ui.js?v=13.58','js/ui.js?v=13.59','ui js cache')
          write(p,s)

          # ui.js — visible TEST version marker only.
          p='js/ui.js'; s=read(p)
          s=once(s,"// TEST v13.58 — desktop parchment top gap set to 40px; TEST-only version marker.","// TEST v13.59 — hide quest objective during mobile combat; TEST-only version marker.",'ui comment')
          s=once(s,"const version='v13.58';","const version='v13.59';",'ui version')
          write(p,s)

          # Validation: exploration styling retained; only combat on <=800px hides it.
          css=read('css/main.css'); idx=read('index.html'); ui=read('js/ui.js')
          assert css.count('body.combatActive #questObjective{display:none!important;}') == 1
          assert 'top:51px;' in css
          assert 'data-build-version="v13.59"' in idx
          assert 'css/main.css?v=13.59' in idx
          assert 'js/ui.js?v=13.59' in idx
          assert "const version='v13.59';" in ui
          print('v13.59 validated: quest hidden only during mobile combat')
          PY

      - name: Commit validated update
        shell: bash
        run: |
          rm -f .github/workflows/mobile-hide-quest-v1359.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add css/main.css index.html js/ui.js .github/workflows/mobile-hide-quest-v1359.yml
          git diff --cached --check
          git commit -m "v13.59: hide quest objective during mobile combat"
          git push
