name: BOD3D TEST v13.57 parchment gap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set desktop parchment top gap to 20px only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          # css/patches.css — ONLY change the two desktop top padding values.
          p='css/patches.css'; s=read(p)
          s=once(s,
              'padding:7.5% 7.5% 6.5% 7.5%!important;',
              'padding:20px 7.5% 6.5% 7.5%!important;',
              'standard desktop parchment padding')
          s=once(s,
              'padding:7% 7.5% 5.8% 7.5%!important;',
              'padding:20px 7.5% 5.8% 7.5%!important;',
              'short desktop parchment padding')
          write(p,s)

          # index.html — version marker and cache bust only.
          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.56"','data-build-version="v13.57"','build version')
          s=once(s,'css/patches.css?v=13.54','css/patches.css?v=13.57','patches css cache')
          s=once(s,'js/ui.js?v=13.56','js/ui.js?v=13.57','ui js cache')
          write(p,s)

          # ui.js — version marker only.
          p='js/ui.js'; s=read(p)
          s=once(s,"// TEST v13.56 — quest wording refined; TEST-only version marker.","// TEST v13.57 — desktop parchment top gap set to 20px; TEST-only version marker.",'ui comment')
          s=once(s,"const version='v13.56';","const version='v13.57';",'ui version')
          write(p,s)

          # Validate exact intended scope.
          css=read('css/patches.css'); idx=read('index.html'); ui=read('js/ui.js')
          assert css.count('padding:20px 7.5% 6.5% 7.5%!important;') == 1
          assert css.count('padding:20px 7.5% 5.8% 7.5%!important;') == 1
          assert 'padding:7.5% 7.5% 6.5% 7.5%!important;' not in css
          assert 'padding:7% 7.5% 5.8% 7.5%!important;' not in css
          assert 'padding:8.5% 12.5% 6.5% 14.5%!important;' in css  # mobile untouched
          assert 'data-build-version="v13.57"' in idx
          assert 'css/patches.css?v=13.57' in idx
          assert 'js/ui.js?v=13.57' in idx
          assert "const version='v13.57';" in ui
          print('v13.57 validated: only desktop parchment top gap changed to 20px')
          PY

      - name: Commit validated update
        shell: bash
        run: |
          rm -f .github/workflows/parchment-gap-v1357.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add css/patches.css index.html js/ui.js .github/workflows/parchment-gap-v1357.yml
          git diff --cached --check
          git commit -m "v13.57: set desktop parchment top gap to 20px"
          git push
