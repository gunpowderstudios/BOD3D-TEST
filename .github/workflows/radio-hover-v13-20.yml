name: Dungeon Radio reverse hover v13.20
on:
  push:
    paths:
      - '.github/workflows/radio-hover-v13-20.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reverse radio rollover
        shell: python
        run: |
          from pathlib import Path
          p=Path('css/patches.css')
          s=p.read_text()
          old='''.radioTransport button:hover,\n.radioChoose:hover,\n.radioTrackButton:hover,\n.radioTrackButton.active{\n background:#8B1F22;\n color:#fff;\n}\n'''
          new='''.radioTransport button:hover,\n.radioChoose:hover,\n.radioTrackButton:hover{\n background:#fff;\n color:#050505;\n -webkit-text-fill-color:#050505;\n}\n.radioTrackButton.active{\n background:#8B1F22;\n color:#E9BB00;\n}\n.radioTrackButton:hover .radioTrackArtist{\n color:#050505;\n -webkit-text-fill-color:#050505;\n opacity:1;\n}\n'''
          if old not in s:
              raise SystemExit('Expected radio hover block not found')
          p.write_text(s.replace(old,new,1))
          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.18"','data-build-version="v13.20"',1)
          h=h.replace('css/patches.css?v=13.02','css/patches.css?v=13.20',1)
          i.write_text(h)
      - name: Commit
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add css/patches.css index.html
          git commit -m "Make Dungeon Radio rollover reverse black and white v13.20"
          git push
