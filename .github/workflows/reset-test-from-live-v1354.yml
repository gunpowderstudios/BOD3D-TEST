name: BOD3D TEST v13.54 reset from Live

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild TEST from working Live baseline
        shell: bash
        run: |
          set -euo pipefail
          OLD_HEAD=$(git rev-parse HEAD)
          echo "Previous TEST head: $OLD_HEAD"

          git clone --depth 1 https://github.com/gunpowderstudios/BOD3D.git /tmp/bod3d-live

          # Replace the TEST working tree with Live, while retaining TEST repository metadata/workflows.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/bod3d-live/ ./

          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION='v13.54'
          CACHE='13.54'

          # TEST index: same as Live except TEST version, noindex/nofollow, and fresh local caches.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          n=s.count('data-build-version="v13.38"')
          if n != 1:
              raise SystemExit(f'index build marker: expected Live v13.38 exactly once, found {n}')
          s=s.replace('data-build-version="v13.38"',f'data-build-version="{VERSION}"',1)

          robots='''\n<!-- TEST-ONLY SEO START: remove this block when promoting index.html to LIVE -->\n<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />\n<!-- TEST-ONLY SEO END -->\n'''
          if 'TEST-ONLY SEO START' in s or 'name="robots"' in s:
              raise SystemExit('unexpected robots block already present in copied Live index')
          pat=re.compile(r'(<script type="application/ld\+json">.*?</script>)',re.S)
          matches=pat.findall(s)
          if len(matches)!=1:
              raise SystemExit(f'JSON-LD block: expected 1 match, found {len(matches)}')
          s=pat.sub(lambda m:m.group(1)+robots,s,count=1)

          # Force TEST to fetch the clean Live-derived CSS/JS rather than any cached v13.51-v13.53 files.
          local_ref=re.compile(r'((?:href|src)="(?:css|js)/[^"?]+)(?:\?v=[^"]*)?(")')
          s,count=local_ref.subn(lambda m:m.group(1)+f'?v={CACHE}'+m.group(2),s)
          if count < 6:
              raise SystemExit(f'cache busting: expected several local CSS/JS refs, changed only {count}')
          p.write_text(s,encoding='utf-8')

          # TEST UI: retain Live behaviour exactly, only change the visible TEST build number/comment.
          p=Path('js/ui.js')
          s=p.read_text(encoding='utf-8')
          n=len(re.findall(r"const version='v\d+\.\d+';",s))
          if n!=1:
              raise SystemExit(f'ui version constant: expected 1, found {n}')
          s=re.sub(r"const version='v\d+\.\d+';",f"const version='{VERSION}';",s,count=1)
          s=s.replace('// Live v13.48 — approved TEST UI fixes promoted to Live.','// TEST v13.54 — clean working Live baseline; TEST-only version marker.')
          p.write_text(s,encoding='utf-8')

          # Safety checks: TEST-only SEO and dev tools are present; broken cleanup markers are gone.
          idx=Path('index.html').read_text(encoding='utf-8')
          ui=Path('js/ui.js').read_text(encoding='utf-8')
          game=Path('js/game.js').read_text(encoding='utf-8')
          main=Path('css/main.css').read_text(encoding='utf-8')
          mobile=Path('css/mobile.css').read_text(encoding='utf-8')

          assert f'data-build-version="{VERSION}"' in idx
          assert 'noindex, nofollow, noarchive, nosnippet' in idx
          assert f"const version='{VERSION}';" in ui
          assert 'BOD3D-TEST' in game and 'DEVELOPER_TOOLS_ENABLED' in game
          for bad in ['canonical v13.52','canonical v13.53','canonical desktop layout v13.51']:
              assert bad not in main
          assert 'canonical mobile layout v13.53' not in mobile
          print('TEST v13.54 baseline validation passed')
          PY

          # Every non-.github difference from Live must now be intentional and limited to these two files.
          set +e
          diff_output=$(diff -qr --exclude='.git' --exclude='.github' /tmp/bod3d-live .)
          diff_status=$?
          set -e
          echo "$diff_output"
          if [ "$diff_status" -ne 0 ]; then
            unexpected=$(printf '%s\n' "$diff_output" | grep -vE 'Files /tmp/bod3d-live/(index\.html|js/ui\.js) and \./(index\.html|js/ui\.js) differ$' || true)
            if [ -n "$unexpected" ]; then
              echo "Unexpected differences from Live:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          fi

      - name: Commit clean TEST baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reset-test-from-live-v1354.yml
          git config user.name "BOD3D TEST reset"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v13.54: reset TEST to working Live baseline"
          git push
