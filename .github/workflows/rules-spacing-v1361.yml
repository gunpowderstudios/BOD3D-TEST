name: BOD3D TEST v13.61 compact Rules spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten Rules spacing and colour headings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          start=s.index('function openRules(){')
          end=s.index('\nfunction openMenu(){',start)
          block=s[start:end]

          block=once(
              block,
              'max-height:min(62dvh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;line-height:1.35;padding:2px 6px 4px',
              'max-height:min(62dvh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;line-height:1.35;padding:2px 6px 4px;white-space:normal',
              'Rules wrapper whitespace'
          )

          headings=['Your Quest','Explore the Dungeon','Fight Monsters','Find Treasure','Find the Ring','Defeat the Red Dragon','Death']
          for heading in headings:
              pattern=r'<p><b>'+re.escape(heading)+r'</b><br>(.*?)</p>'
              repl=r'<div><b style="color:#E9BA00">'+heading+r'</b><br>\1</div>'
              block,n=re.subn(pattern,repl,block,count=1)
              if n!=1:
                  raise SystemExit(f'{heading}: expected exactly 1 paragraph, found {n}')

          block=once(
              block,
              '<p style="text-align:center;margin-bottom:0"><b>One life, one chance and one more forgotten hero!</b></p>',
              '<div style="text-align:center"><b>One life, one chance and one more forgotten hero!</b></div>',
              'Rules closing line'
          )

          if '<p' in block or '</p>' in block:
              raise SystemExit('Rules block still contains paragraph tags')
          if block.count('#E9BA00')!=7:
              raise SystemExit(f'Expected 7 yellow Rules headings, found {block.count("#E9BA00")}')

          s=s[:start]+block+s[end:]
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.60"','data-build-version="v13.61"','build version')
          s=once(s,'js/game.js?cache=20260813-v1360','js/game.js?cache=20260813-v1361','game cache')
          s=once(s,'js/ui.js?v=13.60','js/ui.js?v=13.61','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,"// TEST v13.60 — add basic Rules to hamburger menu; TEST-only version marker.","// TEST v13.61 — compact Rules spacing and yellow section headings; TEST-only version marker.",'ui comment')
          s=once(s,"const version='v13.60';","const version='v13.61';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          rs=game[game.index('function openRules(){'):game.index('\nfunction openMenu(){',game.index('function openRules(){'))]
          assert rs.count('#E9BA00') == 7
          assert '<p' not in rs and '</p>' not in rs
          assert 'white-space:normal' in rs
          assert "showModal('HOW TO PLAY'" in rs
          assert 'data-build-version="v13.61"' in idx
          assert 'js/game.js?cache=20260813-v1361' in idx
          assert 'js/ui.js?v=13.61' in idx
          assert "const version='v13.61';" in ui
          print('v13.61 validated: yellow Rules headings, paragraph gaps removed')
          PY

      - name: Commit validated TEST v13.61
        shell: bash
        run: |
          rm -f .github/workflows/rules-spacing-v1361.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/rules-spacing-v1361.yml
          git diff --cached --check
          git commit -m "v13.61: tighten Rules spacing and colour headings"
          git push
