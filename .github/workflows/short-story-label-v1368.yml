name: BOD3D TEST v13.68 short story menu label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename Short Story menu item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          s=once(s,"{text:'The Short Story',fn:()=>{closeModal();openShortStory();}},","{text:'A Short Story',fn:()=>{closeModal();openShortStory();}},",'menu label')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.67"','data-build-version="v13.68"','build version')
          s=once(s,'js/game.js?cache=20260813-v1367','js/game.js?cache=20260813-v1368','game cache')
          s=once(s,'js/ui.js?v=13.67','js/ui.js?v=13.68','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// TEST v13.67 — remove outside-click popup closing; TEST-only version marker.','// TEST v13.68 — rename The Short Story menu item to A Short Story; TEST-only version marker.','ui comment')
          s=once(s,"const version='v13.67';","const version='v13.68';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          assert "{text:'A Short Story',fn:()=>{closeModal();openShortStory();}}," in game
          assert "{text:'The Short Story',fn:()=>{closeModal();openShortStory();}}," not in game
          assert "showModal('THE SHORT STORY'" in game
          assert 'data-build-version="v13.68"' in idx
          assert 'js/game.js?cache=20260813-v1368' in idx
          assert 'js/ui.js?v=13.68' in idx
          assert "const version='v13.68';" in ui
          print('v13.68 validated: menu label is A Short Story; story popup remains unchanged')
          PY

      - name: Commit validated TEST v13.68
        shell: bash
        run: |
          rm -f .github/workflows/short-story-label-v1368.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/short-story-label-v1368.yml
          git diff --cached --check
          git commit -m "v13.68: rename Short Story menu item"
          git push