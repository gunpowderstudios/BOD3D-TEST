name: Tile drop animation v13.26
on:
  push:
    paths:
      - '.github/workflows/tile-drop-v13-26.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tabletop tile drop
        shell: python
        run: |
          from pathlib import Path

          scene=Path('js/scene3d.js')
          s=scene.read_text()

          old="""const TILE=2.05;
const TILE_THICKNESS=.10;
const PHYSICAL_TILE_MM=50;
const DRAGON_BASE_MM=78;
"""
          new="""const TILE=2.05;
const TILE_THICKNESS=.10;
const PHYSICAL_TILE_MM=50;
const DRAGON_BASE_MM=78;
// Newly laid punchboard tiles drop from roughly 10 mm above the tabletop.
const TILE_DROP_HEIGHT=TILE*(10/PHYSICAL_TILE_MM);
const TILE_DROP_MS=400;
let pendingTileDropKey=null;
function queueTileDrop(tileKey){pendingTileDropKey=String(tileKey||'');}
function animateTileDrop(tileKey,tileBody,topMesh,sideMaterial,topMaterial){
 if(pendingTileDropKey!==tileKey)return;
 pendingTileDropKey=null;
 const bodyRestY=tileBody.position.y;
 const topRestY=topMesh.position.y;
 tileBody.position.y=bodyRestY+TILE_DROP_HEIGHT;
 topMesh.position.y=topRestY+TILE_DROP_HEIGHT;
 [sideMaterial,topMaterial].forEach(material=>{
  material.transparent=true;
  material.opacity=0;
  material.depthWrite=false;
  material.needsUpdate=true;
 });
 const started=performance.now();
 const frame=now=>{
  const t=Math.min(1,(now-started)/TILE_DROP_MS);
  const fall=1-Math.pow(1-t,3);
  const fade=Math.min(1,t/.72);
  tileBody.position.y=THREE.MathUtils.lerp(bodyRestY+TILE_DROP_HEIGHT,bodyRestY,fall);
  topMesh.position.y=THREE.MathUtils.lerp(topRestY+TILE_DROP_HEIGHT,topRestY,fall);
  sideMaterial.opacity=fade;
  topMaterial.opacity=fade;
  if(t<1){requestAnimationFrame(frame);return;}
  tileBody.position.y=bodyRestY;
  topMesh.position.y=topRestY;
  [sideMaterial,topMaterial].forEach(material=>{
   material.opacity=1;
   material.transparent=false;
   material.depthWrite=true;
   material.needsUpdate=true;
  });
  // The placement sound belongs to the physical impact, not the Place button.
  if(typeof sndTile==='function')sndTile();
  else if(typeof playSound==='function')playSound('tile');
 };
 requestAnimationFrame(frame);
}
"""
          if old not in s: raise SystemExit('scene constants block not found')
          s=s.replace(old,new,1)

          old=""" markClickable(mesh,'tile',key);
 boardGroup.add(mesh);

 const darkness=darknessForTile(x,y);
"""
          new=""" markClickable(mesh,'tile',key);
 boardGroup.add(mesh);
 animateTileDrop(key,tileBody,mesh,sideMaterial,topMaterial);

 const darkness=darknessForTile(x,y);
"""
          if old not in s: raise SystemExit('tile mesh insertion point not found')
          s=s.replace(old,new,1)

          old="""window.BOD3D={
 render:renderBoard,
 clearDice3D,
"""
          new="""window.BOD3D={
 render:renderBoard,
 clearDice3D,
 queueTileDrop,
"""
          if old not in s: raise SystemExit('BOD3D export block not found')
          s=s.replace(old,new,1)
          scene.write_text(s)

          game=Path('js/game.js')
          g=game.read_text()
          old=""" p.ap-=1;
 sndTile();log('Placed '+TILE_LABEL[tile.kind]+(tile.itemMarker?' with item marker':'')+' to the '+placement.dir+'.','system');if(state.tileDeck.length===0&&!state.exitPlaced)placeExitAndRing(nx,ny,tile);placement=null;document.getElementById('placement').classList.remove('open');render();setTimeout(()=>centreOnHero(),0);};
"""
          new=""" p.ap-=1;
 window.BOD3D?.queueTileDrop?.(key(nx,ny));log('Placed '+TILE_LABEL[tile.kind]+(tile.itemMarker?' with item marker':'')+' to the '+placement.dir+'.','system');if(state.tileDeck.length===0&&!state.exitPlaced)placeExitAndRing(nx,ny,tile);placement=null;document.getElementById('placement').classList.remove('open');render();setTimeout(()=>centreOnHero(),0);};
"""
          if old not in g: raise SystemExit('tile placement sound block not found')
          game.write_text(g.replace(old,new,1))

          index=Path('index.html')
          h=index.read_text()
          h=h.replace('data-build-version="v13.25"','data-build-version="v13.26"',1)
          h=h.replace('js/game.js?cache=20260807-health-hud-v1322','js/game.js?cache=20260807-tile-drop-v1326',1)
          h=h.replace('js/scene3d.js?cache=20260807-combat-pulse-v1316','js/scene3d.js?cache=20260807-tile-drop-v1326',1)
          index.write_text(h)
      - name: Commit TEST v13.26
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/scene3d.js js/game.js index.html
          git commit -m "Drop newly placed tiles from 10mm with fade and impact sound v13.26"
          git push
