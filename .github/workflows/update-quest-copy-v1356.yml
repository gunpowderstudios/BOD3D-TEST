name: BOD3D TEST v13.56 quest wording

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update quest wording only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.55"','data-build-version="v13.56"','build version')
          s=once(s,'Your quest — Find the Ring, find Firkin and defeat the Red Dragon.','Your quest — Find the Ring, defeat the Red Dragon and exit the dungeon!','quest wording')
          s=once(s,'js/ui.js?v=13.55','js/ui.js?v=13.56','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// TEST v13.55 — small in-game quest objective added; TEST-only version marker.','// TEST v13.56 — quest objective wording refined; TEST-only version marker.','ui comment')
          s=once(s,"const version='v13.55';","const version='v13.56';",'ui version')
          write(p,s)

          idx=read('index.html'); ui=read('js/ui.js')
          assert 'Your quest — Find the Ring, defeat the Red Dragon and exit the dungeon!' in idx
          assert 'find Firkin' not in idx
          assert 'data-build-version="v13.56"' in idx
          assert 'js/ui.js?v=13.56' in idx
          assert "const version='v13.56';" in ui
          print('v13.56 quest wording validated')
          PY

      - name: Commit validated update
        shell: bash
        run: |
          rm -f .github/workflows/update-quest-copy-v1356.yml
          git config user.name "BOD3D TEST updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html js/ui.js .github/workflows/update-quest-copy-v1356.yml
          git diff --cached --check
          git commit -m "v13.56: refine in-game quest wording"
          git push
