name: One-shot v13.50 TEST index fix

on:
  push:
    paths:
      - '.github/workflows/v1350-index-fix.yml'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical TEST index changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('data-build-version="v13.38"', 'data-build-version="v13.50"'),
              ('css/main.css?v=12.83', 'css/main.css?v=13.50'),
              ('js/ui.js?v=12.78', 'js/ui.js?v=13.50'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify only intended index strings
        run: |
          grep -F 'data-build-version="v13.50"' index.html
          grep -F 'css/main.css?v=13.50' index.html
          grep -F 'js/ui.js?v=13.50' index.html

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/v1350-index-fix.yml
          git config user.name 'BOD3D TEST updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/v1350-index-fix.yml
          git commit -m 'v13.50: sync TEST build marker and cache-bust updated UI'
          git push
