<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book of Dungeon Story Mapper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>Book of Dungeon Story Mapper</strong>
      <span>prototype</span>
    </div>
    <div class="tools">
      <button id="addNodeBtn">+ Story Node</button>
      <button id="undoBtn" class="secondary" disabled title="Ctrl/Cmd + Z">Undo</button>
      <button id="resetModeBtn" class="mode active">Move</button>
      <button id="choiceModeBtn" class="mode">+ Solid Line</button>
      <button id="readModeBtn" class="mode">+ Dotted Line</button>
      <button id="toggleLineBtn" class="secondary" disabled>Change Line</button>
      <button id="deleteLineBtn" class="secondary danger" disabled>Delete Line</button>
      <button id="deleteModeBtn" class="mode danger">Delete Box</button>
      <span class="divider"></span>
      <button id="saveBtn" class="secondary">Save</button>
      <button id="exportBtn" class="secondary">Export JSON</button>
      <label class="fileBtn secondary">Import JSON<input id="importInput" type="file" accept="application/json,.json"></label>
      <button id="clearBtn" class="secondary danger">Clear</button>
    </div>
  </header>

  <div class="hint" id="hint">Move mode: drag boxes freely. Double-click a title box to edit its full story.</div>

  <main id="workspace" aria-label="Scrollable story map workspace">
    <div id="canvas">
      <svg id="links" aria-label="Story connections"></svg>
      <div id="nodes"></div>
    </div>
  </main>

  <aside id="editor" class="editor hidden" aria-live="polite">
    <div class="editorTop">
      <strong id="editorHeading">Edit story node</strong>
      <button id="closeEditorBtn" aria-label="Close editor">×</button>
    </div>
    <label>Number
      <input id="nodeNumber" type="number" min="1" step="1" />
    </label>
    <label>Title
      <input id="nodeTitle" type="text" placeholder="Troll Bridge" />
    </label>
    <label>Story text / note
      <textarea id="nodeText" rows="12" placeholder="A large bridge stands before you..."></textarea>
    </label>
    <label class="check"><input id="mapNode" type="checkbox" /> Printed on dungeon map</label>
    <button id="applyNodeBtn">Apply</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
