<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book of Dungeon Story Mapper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>Book of Dungeon Story Mapper</strong>
      <span>prototype</span>
    </div>
    <div class="tools">
      <button id="addNodeBtn">+ Story Node</button>
      <button id="undoBtn" class="secondary" disabled title="Ctrl/Cmd + Z">Undo</button>
      <button id="choiceModeBtn" class="mode active">Solid: Choice</button>
      <button id="readModeBtn" class="mode">Dotted: Read</button>
      <button id="deleteModeBtn" class="mode danger">Delete</button>
      <button id="resetModeBtn" class="secondary">Move</button>
      <span class="divider"></span>
      <button id="saveBtn" class="secondary">Save</button>
      <button id="exportBtn" class="secondary">Export JSON</button>
      <label class="fileBtn secondary">Import JSON<input id="importInput" type="file" accept="application/json,.json"></label>
      <button id="clearBtn" class="secondary danger">Clear</button>
    </div>
  </header>

  <div class="hint" id="hint">Choice mode: click one node, then another to draw a solid route.</div>

  <main id="workspace" aria-label="Story map workspace">
    <svg id="links" aria-hidden="true"></svg>
    <div id="nodes"></div>
  </main>

  <aside id="editor" class="editor hidden" aria-live="polite">
    <div class="editorTop">
      <strong>Edit node</strong>
      <button id="closeEditorBtn" aria-label="Close editor">×</button>
    </div>
    <label>Number
      <input id="nodeNumber" type="number" min="1" step="1" />
    </label>
    <label>Title
      <input id="nodeTitle" type="text" placeholder="Old corridor" />
    </label>
    <label>Story text / note
      <textarea id="nodeText" rows="5" placeholder="You hear a lock click behind you..."></textarea>
    </label>
    <label class="check"><input id="mapNode" type="checkbox" /> Printed on dungeon map</label>
    <button id="applyNodeBtn">Apply</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
